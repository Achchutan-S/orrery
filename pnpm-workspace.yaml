packages:
  - apps/*
  - packages/*
  - tools/*
# Node policy (ADR-021): installing with a Node outside every package's engines.node fails.
engineStrict: true
onlyBuiltDependencies:
  - esbuild
  - sharp
# @astrojs/astro2tsx@0.1.3 provides @emnapi/core but not the @emnapi/runtime peer that
# @napi-rs/wasm-runtime needs. On Astro 7 another package happens to install it, but
# that is incidental; this entry keeps `astro check` loadable. Remove when astro2tsx declares it.
packageExtensions:
  '@astrojs/astro2tsx@0.1.3':
    dependencies:
      '@emnapi/runtime': 1.11.3
# esbuild is only Vite's optional peer here; pnpm auto-installed 0.27.x, which has a low advisory
# for the Windows dev server (GHSA-g7r4-m6w7-qqqr). With this override (Vite 8 accepts ^0.28) the
# optional peer is no longer installed at all; builds and both dev servers work without it
# (ADR-023). Remove when Vite resolves a fixed esbuild by itself.
overrides:
  esbuild: 0.28.2
